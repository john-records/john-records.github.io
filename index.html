<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>John Records</title>
<meta name="description" content="Books, editions and letters on contemplative practice and the work of compassion." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet" />
<style>
:root{
  --paper:#fcfcfa; --ink:#1d1d1b; --soft:#6a685f; --mark:#8a5a2b; --rule:#dedbd2;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  font-size:21px; line-height:1.65; -webkit-font-smoothing:antialiased;
  min-height:100vh; display:flex; align-items:center; justify-content:center;
  padding:32px;
}
main{max-width:34em}
h1{font-size:clamp(40px,7vw,58px); font-weight:400; margin:0 0 18px; line-height:1.1}
p{margin:0 0 14px; color:var(--soft)}
a{color:var(--mark)}
a:hover{text-decoration:none}
.works{border-top:1px solid var(--rule); margin-top:30px; padding-top:24px}
.works a{display:block; text-decoration:none; font-size:26px; margin:0 0 4px}
.works a:hover{text-decoration:underline}
.works .about{font-size:18px; font-style:italic; color:var(--soft); margin:0}
</style>
</head>
<body>
<main>
  <h1>John Records</h1>
  <p>Books, editions and letters on contemplative practice and the work of
     compassion. This site is being assembled; what is finished is already here.</p>
  <div class="works">
    <a href="/autobiography-of-a-yogi/">Autobiography of a Yogi</a>
    <p class="about">Paramahansa Yogananda &mdash; the 1946 text, annotated, with
       the whole book read aloud. 49 chapters, 17 hours.</p>
  </div>
</main>
</body>
</html>
